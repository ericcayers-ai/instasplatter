# Multi-platform Tauri 2 installer builds for InstaSplatter v0.10+.
#
# Triggers:
#   - workflow_dispatch — build + upload CI artifacts (no GitHub Release)
#   - push tags v*     — build + upload artifacts; then attach to the GitHub Release for that tag
#
# Caveats:
#   - Linux needs WebKitGTK 4.1 (+ related GTK/rsvg/patchelf packages).
#   - AppImage on modern glibc: NO_STRIP=true avoids linuxdeploy strip failures.
#   - macOS: unsigned / ad-hoc dmg is intentional for v0.10 (no notarization secrets).
#   - Linux/macOS are best-effort; Windows NSIS remains the primary supported installer.
#   - ANUGA/SWMM scientific sidecars are not bundled in these installers.

name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundle: nsis
          - platform: ubuntu-latest
            bundle: linux
          - platform: macos-latest
            bundle: dmg

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.1.7

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.2.0
        with:
          node-version: "20"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@a54c7afa936fefeb4456b2dd8068152669aa8203 # stable

      - name: Rust cache
        uses: swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.7
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Rust tests
        run: cargo test --locked
        working-directory: src-tauri

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Frontend build
        run: npm run build

      - name: Tauri build
        env:
          # Avoid AppImage linuxdeploy strip failures on newer glibc (.relr.dyn).
          NO_STRIP: ${{ matrix.platform == 'ubuntu-latest' && 'true' || '' }}
        run: npm run tauri build

      - name: Upload Windows NSIS artifact
        if: matrix.bundle == 'nsis'
        uses: actions/upload-artifact@b4b15c8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: windows-nsis
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload Linux artifacts
        if: matrix.bundle == 'linux'
        uses: actions/upload-artifact@b4b15c8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: linux-appimage-deb
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Upload macOS dmg artifact
        if: matrix.bundle == 'dmg'
        uses: actions/upload-artifact@b4b15c8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: macos-dmg
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  draft-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: installers
          merge-multiple: true

      - name: Generate checksums
        working-directory: installers
        run: sha256sum * > SHA256SUMS

      - name: Attach installers to GitHub Release
        uses: softprops/action-gh-release@c062c752d4a4e4d1b1cfcd1e3f7ea7bddf267392 # v2.2.1
        with:
          draft: true
          generate_release_notes: true
          body: |
            See [RELEASE.md](./RELEASE.md) and
            [docs/assets/verify/v0.10/VERIFY-SUMMARY.md](./docs/assets/verify/v0.10/VERIFY-SUMMARY.md).

            **Platforms:** Windows NSIS (primary); Linux AppImage/deb and macOS dmg are best-effort.
            **Signing:** macOS builds are unsigned / ad-hoc for v0.10 (no notarization secrets).
          files: |
            installers/**
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
